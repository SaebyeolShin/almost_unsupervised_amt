defaults:
  - _self_

experiment_name: "musicnet_vae"
run_name: null
seed: 42

data:
  preprocessed_root: "[YOUR_DATA_DIR]"      # path to musicnet_em_preprocessed/ (output of preprocess_musicnet_em.py)
  num_instruments: 11                        # K=11 instrument channels
  val_fraction: 0.1
  batch_size: 64
  num_workers: 4
  pin_memory: True

model:
  num_instruments: 11                        # must match data.num_instruments
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  z_channels: 8
  kl_weight: 1e-8
  binary_mode: True
  attn_heads: 2
  attn_dim_head: 16
  loss_type: "bce"
  focal_gamma: 2.0
  focal_alpha: 0.75

training:
  learning_rate: 2e-4
  max_epochs: 200
  accelerator: "gpu"
  devices: 1
  precision: "bf16-mixed"
  ema_decay: 0.99
  log_every_n_steps: 10
  val_check_interval: 500
  gradient_clip_val: 1.0
  save_top_k: 3

logging:
  project: "musicnet-vae"
  entity: "[YOUR_WANDB_ENTITY]"             # your W&B username or team (set to null to skip W&B)
  offline: False
  save_dir: "[YOUR_LOG_DIR]"                # directory to save checkpoints and logs
